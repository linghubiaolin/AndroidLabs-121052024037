name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 新增实验时，在这里追加目录名即可，例如 [lab1, lab2, lab3, midterm, lab4]
        lab: [ lab1, lab2, lab3, midterm ]

    defaults:
      run:
        working-directory: ${{ matrix.lab }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # midterm 用到 compileSdk 37，托管 runner 一般没预装，这里按包名兜底安装
      - name: Install Android platform 37 (midterm only)
        if: matrix.lab == 'midterm'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" || "$SDKMANAGER" "platforms;android-37"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ matrix.lab }}
          path: ${{ matrix.lab }}/app/build/outputs/apk/debug/app-debug.apk
